name: Terraform CI/CD (dambda)
# CI 트리거 확인용
on:
  pull_request:
    branches: [main]
    paths: ["dambda/**"]
  push:
    branches: [main]
    paths: ["dambda/**"]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      # aws/grafana/kubernetes/tls provider 바이너리를 캐시 디렉터리에서 재사용 -
      # 특히 aws provider가 커서(수백MB) 매번 새로 받으면 init에서만 1분 가까이 걸림
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2
          role-skip-session-tagging: true
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.7"
      - name: Cache Terraform provider plugins
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          # lock 파일이 바뀔 때만(provider 버전 변경 시) 캐시를 새로 채움. 캐시가 비어있는
          # 첫 실행은 복원 시도+새로 채우는 비용 때문에 오히려 조금 더 걸릴 수 있음 -
          # 효과는 두 번째 실행부터 체감됨. 그리고 이 워크플로우의 진짜 병목은 NAT
          # Gateway/CloudFront/ALB 같은 AWS 쪽 생성 대기시간이라 여기 캐싱은 그 전
          # init 단계만 줄여줄 뿐, 전체 실행시간 체감 차이는 크지 않을 수 있음
          key: tf-plugin-cache-${{ hashFiles('dambda/.terraform.lock.hcl') }}
      - name: Create plugin cache dir
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - name: Terraform init
        working-directory: dambda
        run: terraform init -input=false
      - name: Terraform Validate
        working-directory: dambda
        run: terraform validate
      # 보안 설정 실수(퍼블릭 S3, 암호화 누락 등)를 apply 전에 자동으로 잡아냄. soft_fail로
      # 시작 - 기존 리소스 대상 findings를 한 번에 다 못 고치니 지금은 경고만 띄우고 CI를
      # 막지 않음. 베이스라인 확인 후 hard-fail(soft_fail 제거)로 전환 검토
      - name: Checkov (Terraform 정적 분석)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: dambda
          soft_fail: true
          quiet: true
      # data.aws_eks_cluster.this(providers.tf)가 kubernetes/helm provider 설정용으로
      # module.eks.cluster_name(생성 전에도 이름 자체는 계산 가능한 문자열)을 조회하는데,
      # 계정이 완전히 비어있으면(클러스터가 아직 없으면) 그 조회가 진짜 AWS 404로 실패해서
      # plan 자체가 막힘 - Terraform+EKS 조합의 잘 알려진 제약(HashiCorp도 문서화한 "첫
      # apply는 2단계로" 패턴)이라 코드로 완전히 없앨 수는 없음. 사람이 매번 -target을 직접
      # 치는 대신, CI가 클러스터만 먼저 부트스트랩하고 바로 이어서 전체 plan/apply를 돌리게
      # 자동화함 - 클러스터가 이미 있으면 그냥 변경 없음으로 끝나서 매 실행에 안전하게 넣어도 됨.
      # module.eks_us(us-east-1 pilot-light DR)도 같은 이유로 같이 타겟팅해둠 - enable_eks_us가
      # 기본 false라 지금은 count=0(클러스터 자체는 안 생김, 의존값 해석용 network_us
      # VPC/서브넷 정도만 앞당겨 생성될 수 있음 - 어차피 무료+무조건 생성 리소스라 무해함)라
      # 안전한 no-op이고, 나중에 enable_eks_us=true로 DR을 승격해도 이 스텝을 또 안 고쳐도 됨
      - name: Terraform Apply - Bootstrap EKS cluster (idempotent)
        if: github.event_name == 'push'
        working-directory: dambda
        env:
          TF_VAR_region_name: my-app-dev
          TF_VAR_tavily_api_key: ${{ secrets.TAVILY_API_KEY }}
          TF_VAR_admin_notification_email: ${{ secrets.ADMIN_NOTIFICATION_EMAIL }}
          TF_VAR_enable_prometheus: ${{ secrets.ENABLE_PROMETHEUS }}
          TF_VAR_prometheus_workspace_arn: ${{ secrets.PROMETHEUS_WORKSPACE_ARN }}
          TF_VAR_enable_grafana: ${{ secrets.ENABLE_GRAFANA }}
          TF_VAR_grafana_admin_sso_group_ids: ${{ secrets.GRAFANA_ADMIN_SSO_GROUP_IDS }}
          TF_VAR_route53_cloudfront: ${{ vars.ROUTE53_CLOUDFRONT }}
          TF_VAR_route53_zone_name: ${{ vars.ROUTE53_ZONE_NAME }}
          TF_VAR_enable_slack_alerts: ${{ secrets.ENABLE_SLACK_ALERTS }}
          TF_VAR_slack_team_id: ${{ secrets.SLACK_TEAM_ID }}
          TF_VAR_slack_channel_id: ${{ secrets.SLACK_CHANNEL_ID }}
          TF_VAR_eks_admin_principal_arns: ${{ secrets.EKS_ADMIN_PRINCIPAL_ARNS }}
        run: terraform apply -input=false -auto-approve -target=module.eks.aws_eks_cluster.main -target=module.eks_us.aws_eks_cluster.main

      - name: Terraform Plan
        working-directory: dambda
        env:
          TF_VAR_region_name: my-app-dev
          TF_VAR_tavily_api_key: ${{ secrets.TAVILY_API_KEY }}
          TF_VAR_admin_notification_email: ${{ secrets.ADMIN_NOTIFICATION_EMAIL }}
          TF_VAR_enable_prometheus: ${{ secrets.ENABLE_PROMETHEUS }}
          TF_VAR_prometheus_workspace_arn: ${{ secrets.PROMETHEUS_WORKSPACE_ARN }}
          TF_VAR_enable_grafana: ${{ secrets.ENABLE_GRAFANA }}
          TF_VAR_grafana_admin_sso_group_ids: ${{ secrets.GRAFANA_ADMIN_SSO_GROUP_IDS }}
          TF_VAR_route53_cloudfront: ${{ vars.ROUTE53_CLOUDFRONT }}
          TF_VAR_route53_zone_name: ${{ vars.ROUTE53_ZONE_NAME }}
          # guardduty/cost_anomaly_detection은 기본값(true)이 이미 원하는 상태라 CI에
          # 안 넘겨도 됨. tracing도 기본 false라 마찬가지 - Slack만 기본이 꺼짐(false)이고
          # 실제 값(team/channel id)도 필요해서 여기 넘겨야 함
          TF_VAR_enable_slack_alerts: ${{ secrets.ENABLE_SLACK_ALERTS }}
          TF_VAR_slack_team_id: ${{ secrets.SLACK_TEAM_ID }}
          TF_VAR_slack_channel_id: ${{ secrets.SLACK_CHANNEL_ID }}
          # dambda/terraform.tfvars는 git에 안 올라가는 로컬 전용 파일이라 CI엔 안 보임 -
          # 이걸 안 넘기면 기본값 []로 계산되어, CI 자신을 포함한 기존 EKS 액세스 엔트리를
          # apply가 지워버림(실제로 한 번 겪음: CI가 자기 자신의 클러스터 접근권한을 revoke).
          # grafana_admin_sso_group_ids와 동일하게 list(string)이라 대괄호 문자열로 넘겨야 함
          TF_VAR_eks_admin_principal_arns: ${{ secrets.EKS_ADMIN_PRINCIPAL_ARNS }}
        # -out으로 저장해서 apply가 이 결과를 그대로 재사용하게 함 - 이게 없으면
        # apply 스텝이 내부적으로 plan을 처음부터 다시 계산해서 시간이 거의 2배로 듦
        run: terraform plan -input=false -out=tfplan
      - name: Terraform Apply
        if: github.event_name == 'push'
        working-directory: dambda
        # plan 스텝에서 만든 파일을 그대로 적용 - 변수를 다시 넘길 필요 없음(이미 plan에 반영됨)
        # 이러면 plan~apply 사이에 AWS 상태가 바뀌어도 방금 검토한 그 계획 그대로 적용되는
        # 장점도 있음(매번 새로 diff를 계산하는 것보다 오히려 더 안전함)
        run: terraform apply -input=false tfplan
