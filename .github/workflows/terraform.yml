name: Terraform CI/CD (dambda)
# CI 트리거 확인용
on:
  pull_request:
    branches: [main]
    paths: ["dambda/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["dambda/**", ".github/workflows/terraform.yml"]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      # aws/grafana/kubernetes/tls provider 바이너리를 캐시 디렉터리에서 재사용 -
      # 특히 aws provider가 커서(수백MB) 매번 새로 받으면 init에서만 1분 가까이 걸림
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2
          role-skip-session-tagging: true
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.7"
      - name: Cache Terraform provider plugins
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          # lock 파일이 바뀔 때만(provider 버전 변경 시) 캐시를 새로 채움. 캐시가 비어있는
          # 첫 실행은 복원 시도+새로 채우는 비용 때문에 오히려 조금 더 걸릴 수 있음 -
          # 효과는 두 번째 실행부터 체감됨. 그리고 이 워크플로우의 진짜 병목은 NAT
          # Gateway/CloudFront/ALB 같은 AWS 쪽 생성 대기시간이라 여기 캐싱은 그 전
          # init 단계만 줄여줄 뿐, 전체 실행시간 체감 차이는 크지 않을 수 있음
          key: tf-plugin-cache-${{ hashFiles('dambda/.terraform.lock.hcl') }}
      - name: Create plugin cache dir
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - name: Terraform init
        working-directory: dambda
        run: terraform init -input=false
      - name: Terraform Validate
        working-directory: dambda
        run: terraform validate
      # 보안 설정 실수(퍼블릭 S3, 암호화 누락 등)를 apply 전에 자동으로 잡아냄. soft_fail로
      # 시작 - 기존 리소스 대상 findings를 한 번에 다 못 고치니 지금은 경고만 띄우고 CI를
      # 막지 않음. 베이스라인 확인 후 hard-fail(soft_fail 제거)로 전환 검토.
      # @master(고정 안 된 브랜치) 대신 특정 태그로 고정 - 재현성 + 공급망 보안(이 저장소가
      # 해킹당해도 다음 CI 실행에 즉시 영향 안 받음). 이 저장소는 GitHub "release" 마킹은
      # 2022년에 멈췄지만 태그 자체는 계속 나오고 있어서, release API 대신 태그 목록에서
      # 직접 최신(v12.3117.0, 2026-08-13) 확인함
      - name: Checkov (Terraform 정적 분석)
        uses: bridgecrewio/checkov-action@v12.3117.0
        with:
          directory: dambda
          soft_fail: true
          quiet: true
      # data.aws_eks_cluster.this(providers.tf)가 kubernetes/helm provider 설정용으로
      # module.eks.cluster_name(생성 전에도 이름 자체는 계산 가능한 문자열)을 조회하는데,
      # 계정이 완전히 비어있으면(클러스터가 아직 없으면) 그 조회가 진짜 AWS 404로 실패해서
      # plan 자체가 막힘 - Terraform+EKS 조합의 잘 알려진 제약(HashiCorp도 문서화한 "첫
      # apply는 2단계로" 패턴)이라 코드로 완전히 없앨 수는 없음. 사람이 매번 -target을 직접
      # 치는 대신, CI가 클러스터만 먼저 부트스트랩하고 바로 이어서 전체 plan/apply를 돌리게
      # 자동화함 - 클러스터가 이미 있으면 그냥 변경 없음으로 끝나서 매 실행에 안전하게 넣어도 됨.
      # module.eks_us(us-east-1 pilot-light DR)도 같은 이유로 같이 타겟팅해둠 - enable_eks_us가
      # 기본 false라 지금은 count=0(클러스터 자체는 안 생김, 의존값 해석용 network_us
      # VPC/서브넷 정도만 앞당겨 생성될 수 있음 - 어차피 무료+무조건 생성 리소스라 무해함)라
      # 안전한 no-op이고, 나중에 enable_eks_us=true로 DR을 승격해도 이 스텝을 또 안 고쳐도 됨.
      #
      # module.network/network_us도 여기서 같이 만들어야 함 - aws_eks_cluster.main은 subnet_id
      # 값만 갖다 쓰지 NAT Gateway/라우팅테이블/VPC 엔드포인트는 참조를 안 해서, 클러스터만
      # -target해도 이것들은 안 딸려 들어옴(빈 계정에서 실제로 겪음: NAT/라우팅 없이 서브넷만
      # 있어서 Fargate 파드가 인터넷을 못 타고 CoreDNS/ArgoCD가 전부 이미지 pull 실패로 멈춤).
      #
      # eks_fargate_pod_execution_policy(AmazonEKSFargatePodExecutionRolePolicy 붙이는 것)도
      # 클러스터의 직접 의존성이 아니라서 같은 이유로 안 딸려 들어옴 - 이게 없으면 Fargate
      # 파드 실행 롤에 ECR 인증 권한이 아예 없어서 "no basic auth credentials"로 이미지
      # pull 자체가 실패함(네트워크는 멀쩡해도 남). 실제로 겪어서 targeting에 추가함
      #
      # access_entry/access_policy_association도 클러스터와 같이 부트스트랩해야 함 - 이게
      # 없으면 CI 롤(github-actions-role) 자신이 방금 만든 클러스터에 접근권한이 아예 없는
      # 상태라, kubernetes_manifest 리소스는 plan 단계에서도 실제로 API 서버에 붙어 CRD
      # 스키마를 조회하려다 "Invalid credentials/Unauthorized"로 막힘(토큰 만료가 아니라
      # 애초에 권한 자체가 없는 것 - continue-on-error/재시도로 해결 안 되는 부류의 에러).
      #
      # network/cluster/fargate 정책/access_entry는 전부 aws provider만 씀(kubernetes/helm
      # provider, 즉 EKS 인증 토큰이 필요 없음) - 그래서 이 스텝 하나가 아무리 오래 걸려도
      # (클러스터 생성만 10~15분+CoreDNS 안정화까지 하면 그 이상) 토큰 만료 걱정이 없음
      - name: Terraform Apply - Bootstrap EKS cluster infra (idempotent)
        if: github.event_name == 'push'
        working-directory: dambda
        env:
          TF_VAR_region_name: my-app-dev
          TF_VAR_tavily_api_key: ${{ secrets.TAVILY_API_KEY }}
          TF_VAR_admin_notification_email: ${{ secrets.ADMIN_NOTIFICATION_EMAIL }}
          TF_VAR_enable_prometheus: ${{ secrets.ENABLE_PROMETHEUS }}
          TF_VAR_prometheus_workspace_arn: ${{ secrets.PROMETHEUS_WORKSPACE_ARN }}
          TF_VAR_enable_grafana: ${{ secrets.ENABLE_GRAFANA }}
          TF_VAR_grafana_admin_sso_group_ids: ${{ secrets.GRAFANA_ADMIN_SSO_GROUP_IDS }}
          TF_VAR_route53_cloudfront: ${{ vars.ROUTE53_CLOUDFRONT }}
          TF_VAR_route53_zone_name: ${{ vars.ROUTE53_ZONE_NAME }}
          TF_VAR_enable_slack_alerts: ${{ secrets.ENABLE_SLACK_ALERTS }}
          TF_VAR_slack_team_id: ${{ secrets.SLACK_TEAM_ID }}
          TF_VAR_slack_channel_id: ${{ secrets.SLACK_CHANNEL_ID }}
          TF_VAR_eks_admin_principal_arns: ${{ secrets.EKS_ADMIN_PRINCIPAL_ARNS }}
        run: |
          terraform apply -input=false -auto-approve \
            -target=module.network \
            -target=module.network_us \
            -target=module.eks.aws_eks_cluster.main \
            -target=module.eks.aws_iam_role_policy_attachment.eks_fargate_pod_execution_policy \
            -target=module.eks.aws_eks_access_entry.admin \
            -target=module.eks.aws_eks_access_policy_association.admin \
            -target=module.eks_us.aws_eks_cluster.main \
            -target=module.eks_us.aws_iam_role_policy_attachment.eks_fargate_pod_execution_policy \
            -target=module.eks_us.aws_eks_access_entry.admin \
            -target=module.eks_us.aws_eks_access_policy_association.admin

      # helm_release.aws_load_balancer_controller/argocd는 여기서 별도 terraform 프로세스로
      # 부트스트랩함(=새 EKS 인증 토큰) - 위 인프라 스텝이 클러스터 생성/CoreDNS 안정화로
      # 15분 넘게 걸리는 일이 흔해서, 같은 프로세스 안에 helm 설치까지 같이 넣으면 그 helm
      # 설치 차례가 됐을 때 이미 토큰이 만료돼있을 수 있음(이번 세션에서 로컬로 실제로 겪음).
      # TargetGroupBinding/Application CRD는 이 helm 설치가 끝나야 클러스터에 생기는데, 아래
      # "Terraform Plan"이 apply 전에 미리 CRD 스키마를 확인하려고 해서 이게 없으면 "API did
      # not recognize GroupVersionKind (CRD may not be installed)"로 막힘 - main.tf 주석에도
      # 이미 있던 "신규 클러스터는 최초 1회 2단계 apply 필요" 제약을 CI에도 동일하게 적용
      - name: Terraform Apply - Bootstrap ALB Controller/ArgoCD (idempotent, fresh token)
        if: github.event_name == 'push'
        working-directory: dambda
        env:
          TF_VAR_region_name: my-app-dev
          TF_VAR_tavily_api_key: ${{ secrets.TAVILY_API_KEY }}
          TF_VAR_admin_notification_email: ${{ secrets.ADMIN_NOTIFICATION_EMAIL }}
          TF_VAR_enable_prometheus: ${{ secrets.ENABLE_PROMETHEUS }}
          TF_VAR_prometheus_workspace_arn: ${{ secrets.PROMETHEUS_WORKSPACE_ARN }}
          TF_VAR_enable_grafana: ${{ secrets.ENABLE_GRAFANA }}
          TF_VAR_grafana_admin_sso_group_ids: ${{ secrets.GRAFANA_ADMIN_SSO_GROUP_IDS }}
          TF_VAR_route53_cloudfront: ${{ vars.ROUTE53_CLOUDFRONT }}
          TF_VAR_route53_zone_name: ${{ vars.ROUTE53_ZONE_NAME }}
          TF_VAR_enable_slack_alerts: ${{ secrets.ENABLE_SLACK_ALERTS }}
          TF_VAR_slack_team_id: ${{ secrets.SLACK_TEAM_ID }}
          TF_VAR_slack_channel_id: ${{ secrets.SLACK_CHANNEL_ID }}
          TF_VAR_eks_admin_principal_arns: ${{ secrets.EKS_ADMIN_PRINCIPAL_ARNS }}
        run: |
          terraform apply -input=false -auto-approve \
            -target=module.eks.helm_release.aws_load_balancer_controller \
            -target=module.eks.helm_release.argocd \
            -target=module.eks_us.helm_release.aws_load_balancer_controller \
            -target=module.eks_us.helm_release.argocd

      - name: Terraform Plan
        working-directory: dambda
        env:
          TF_VAR_region_name: my-app-dev
          TF_VAR_tavily_api_key: ${{ secrets.TAVILY_API_KEY }}
          TF_VAR_admin_notification_email: ${{ secrets.ADMIN_NOTIFICATION_EMAIL }}
          TF_VAR_enable_prometheus: ${{ secrets.ENABLE_PROMETHEUS }}
          TF_VAR_prometheus_workspace_arn: ${{ secrets.PROMETHEUS_WORKSPACE_ARN }}
          TF_VAR_enable_grafana: ${{ secrets.ENABLE_GRAFANA }}
          TF_VAR_grafana_admin_sso_group_ids: ${{ secrets.GRAFANA_ADMIN_SSO_GROUP_IDS }}
          TF_VAR_route53_cloudfront: ${{ vars.ROUTE53_CLOUDFRONT }}
          TF_VAR_route53_zone_name: ${{ vars.ROUTE53_ZONE_NAME }}
          # guardduty/cost_anomaly_detection은 기본값(true)이 이미 원하는 상태라 CI에
          # 안 넘겨도 됨. tracing도 기본 false라 마찬가지 - Slack만 기본이 꺼짐(false)이고
          # 실제 값(team/channel id)도 필요해서 여기 넘겨야 함
          TF_VAR_enable_slack_alerts: ${{ secrets.ENABLE_SLACK_ALERTS }}
          TF_VAR_slack_team_id: ${{ secrets.SLACK_TEAM_ID }}
          TF_VAR_slack_channel_id: ${{ secrets.SLACK_CHANNEL_ID }}
          # dambda/terraform.tfvars는 git에 안 올라가는 로컬 전용 파일이라 CI엔 안 보임 -
          # 이걸 안 넘기면 기본값 []로 계산되어, CI 자신을 포함한 기존 EKS 액세스 엔트리를
          # apply가 지워버림(실제로 한 번 겪음: CI가 자기 자신의 클러스터 접근권한을 revoke).
          # grafana_admin_sso_group_ids와 동일하게 list(string)이라 대괄호 문자열로 넘겨야 함
          TF_VAR_eks_admin_principal_arns: ${{ secrets.EKS_ADMIN_PRINCIPAL_ARNS }}
        # -out으로 저장해서 apply가 이 결과를 그대로 재사용하게 함 - 이게 없으면
        # apply 스텝이 내부적으로 plan을 처음부터 다시 계산해서 시간이 거의 2배로 듦
        run: terraform plan -input=false -out=tfplan
      # data.aws_eks_cluster_auth 토큰은 이 apply 프로세스가 시작될 때 딱 한 번 발급되고
      # (~15분 TTL), 계정을 처음부터 다 만드는 이 apply는 NAT/클러스터/ALB Controller/ArgoCD
      # 설치까지 다 거치느라 15분을 넘기기 쉬움 - 그러면 맨 마지막에 실행되는
      # kubernetes_manifest 리소스(TargetGroupBinding, ArgoCD Application)들이 이미 만료된
      # 토큰으로 "Invalid credentials/Unauthorized"를 맞음(이번 세션에서 로컬로도 여러 번
      # 겪은 패턴). continue-on-error로 일단 넘기고, 바로 아래 스텝에서 완전히 새 terraform
      # 프로세스(=새 토큰)로 그 리소스들만 다시 apply해서 해결함
      - name: Terraform Apply
        id: apply
        if: github.event_name == 'push'
        continue-on-error: true
        working-directory: dambda
        # plan 스텝에서 만든 파일을 그대로 적용 - 변수를 다시 넘길 필요 없음(이미 plan에 반영됨)
        # 이러면 plan~apply 사이에 AWS 상태가 바뀌어도 방금 검토한 그 계획 그대로 적용되는
        # 장점도 있음(매번 새로 diff를 계산하는 것보다 오히려 더 안전함)
        run: terraform apply -input=false tfplan

      # 위 apply가 정상적으로 전부 성공했으면 이 스텝은 전부 "변경 없음"으로 조용히 끝남 -
      # 토큰 만료로 kubernetes_manifest만 못 끝냈을 때만 실제로 뭔가를 함. us_east_1 것들은
      # enable_eks_us=false면 count=0이라 어차피 무해한 no-op
      - name: Terraform Apply - Retry token-sensitive k8s manifests (fresh token)
        if: github.event_name == 'push'
        working-directory: dambda
        env:
          TF_VAR_region_name: my-app-dev
          TF_VAR_tavily_api_key: ${{ secrets.TAVILY_API_KEY }}
          TF_VAR_admin_notification_email: ${{ secrets.ADMIN_NOTIFICATION_EMAIL }}
          TF_VAR_enable_prometheus: ${{ secrets.ENABLE_PROMETHEUS }}
          TF_VAR_prometheus_workspace_arn: ${{ secrets.PROMETHEUS_WORKSPACE_ARN }}
          TF_VAR_enable_grafana: ${{ secrets.ENABLE_GRAFANA }}
          TF_VAR_grafana_admin_sso_group_ids: ${{ secrets.GRAFANA_ADMIN_SSO_GROUP_IDS }}
          TF_VAR_route53_cloudfront: ${{ vars.ROUTE53_CLOUDFRONT }}
          TF_VAR_route53_zone_name: ${{ vars.ROUTE53_ZONE_NAME }}
          TF_VAR_enable_slack_alerts: ${{ secrets.ENABLE_SLACK_ALERTS }}
          TF_VAR_slack_team_id: ${{ secrets.SLACK_TEAM_ID }}
          TF_VAR_slack_channel_id: ${{ secrets.SLACK_CHANNEL_ID }}
          TF_VAR_eks_admin_principal_arns: ${{ secrets.EKS_ADMIN_PRINCIPAL_ARNS }}
        run: |
          terraform apply -input=false -auto-approve \
            -target=module.eks.kubernetes_manifest.backend_target_group_binding \
            -target=module.eks.kubernetes_manifest.argocd_application_backend \
            -target=module.eks_us.kubernetes_manifest.backend_target_group_binding \
            -target=module.eks_us.kubernetes_manifest.argocd_application_backend

      # 위 두 apply 스텝(특히 continue-on-error로 한 번 넘어간 것) 이후에도 진짜 문제가
      # 남아있진 않은지 최종 확인 - detailed-exitcode는 0=변경없음, 1=에러, 2=아직 변경
      # 남음이라 1/2 둘 다 이 스텝 자체를 실패시켜서 토큰 만료가 아닌 진짜 에러는 여전히
      # CI가 빨갛게 뜸(continue-on-error로 숨겨지지 않음)
      - name: Terraform Plan - Verify no pending changes
        if: github.event_name == 'push'
        working-directory: dambda
        env:
          TF_VAR_region_name: my-app-dev
          TF_VAR_tavily_api_key: ${{ secrets.TAVILY_API_KEY }}
          TF_VAR_admin_notification_email: ${{ secrets.ADMIN_NOTIFICATION_EMAIL }}
          TF_VAR_enable_prometheus: ${{ secrets.ENABLE_PROMETHEUS }}
          TF_VAR_prometheus_workspace_arn: ${{ secrets.PROMETHEUS_WORKSPACE_ARN }}
          TF_VAR_enable_grafana: ${{ secrets.ENABLE_GRAFANA }}
          TF_VAR_grafana_admin_sso_group_ids: ${{ secrets.GRAFANA_ADMIN_SSO_GROUP_IDS }}
          TF_VAR_route53_cloudfront: ${{ vars.ROUTE53_CLOUDFRONT }}
          TF_VAR_route53_zone_name: ${{ vars.ROUTE53_ZONE_NAME }}
          TF_VAR_enable_slack_alerts: ${{ secrets.ENABLE_SLACK_ALERTS }}
          TF_VAR_slack_team_id: ${{ secrets.SLACK_TEAM_ID }}
          TF_VAR_slack_channel_id: ${{ secrets.SLACK_CHANNEL_ID }}
          TF_VAR_eks_admin_principal_arns: ${{ secrets.EKS_ADMIN_PRINCIPAL_ARNS }}
        run: terraform plan -input=false -detailed-exitcode
