name: Deploy Backend to EKS
# CI 트리거 확인용 (배포 워크플로우 동작 확인)

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

  # dambda/**만 바뀐 push(또는 workflow_dispatch)로 terraform.yml이 돌 때, ECR 레포/backend_foundation
  # 같은 이 워크플로우가 의존하는 리소스가 아직 없을 수 있어서 - terraform.yml이 끝난 뒤 자동으로
  # 뒤따라오게 함. 단, 같은 커밋에서 dambda/**와 backend/**를 동시에 고치면 위 push 트리거가
  # 즉시 한 번 더 도는 것까지는 못 막음(그 경우 실패했다가 이 workflow_run으로 자동 재시도되며 정정됨)
  workflow_run:
    workflows: ["Terraform CI/CD (dambda)"]
    types: [completed]

  workflow_dispatch:

permissions:
  # ArgoCD(GitOps) 전환 이후 배포 트리거는 kubectl이 아니라 k8s/backend/의 이미지 태그를
  # git에 커밋하는 것 - 그 커밋을 push하려면 contents: write가 필요함
  contents: write
  id-token: write
  # Trivy 스캔 결과(SARIF)를 저장소 Security 탭(코드 스캐닝 알림)에 올리는 데 필요
  security-events: write

concurrency:
  group: backend-production
  cancel-in-progress: true

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: my-app-dev-backend

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    # workflow_run은 대상 워크플로우가 성공/실패 상관없이 완료되면 항상 트리거됨 - terraform.yml이
    # 실패했는데 여기서 이어서 배포 시도하면 아직 없는 리소스(ECR 등)를 참조하다 또 실패하므로 스킵
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    steps:
      # workflow_run 트리거는 기본적으로 default 브랜치 최신 커밋을 체크아웃함 - terraform.yml을
      # 트리거한 바로 그 커밋을 가져오도록 head_sha를 명시(그 사이 새 커밋이 push됐을 가능성 대비)
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      # workflow_run으로 트리거되면 github.sha는(문서상) "그 시점 main 브랜치 최신 커밋"이라
      # 위 checkout의 head_sha와 다를 수 있음(그 사이 새 커밋이 더 push됐다면) - 이미지
      # 태그/커밋 메시지가 실제로 빌드된 코드와 다른 SHA를 가리키는 걸 막기 위해, 실제
      # 체크아웃한 커밋의 SHA를 별도로 계산해서 이후 전부 이 값만 씀
      - name: Resolve actual commit SHA
        id: sha
        run: echo "value=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-skip-session-tagging: true

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # buildx가 있어야 레이어 캐시를 쓸 수 있음 - 기본 docker build는 매번 러너를 새로
      # 띄우는 ubuntu-latest 특성상 로컬 캐시가 남아있을 수 없어서, package.json이
      # 안 바뀌어도 npm ci 레이어까지 매번 새로 실행됨
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.sha.outputs.value }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          # type=gha는 저장소 전체가 10GB 캐시 한도를 공유해서(Terraform provider 캐시,
          # Flutter pub 캐시 등과 경쟁) 용량 찰 때마다 이 레이어 캐시부터 밀려날 수 있음 -
          # 이미 로그인/push 중인 ECR 자체를 캐시 저장소로 써서 그 경쟁을 아예 피함
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:buildcache
          cache-to: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:buildcache,mode=max,image-manifest=true

      # 컨테이너 이미지 취약점 스캔 - Checkov(terraform.yml)가 IaC 설정 실수를 잡는 거라면
      # 이건 이미지 안 OS 패키지/라이브러리의 알려진 CVE를 잡음. Checkov와 동일한 이유로
      # soft-fail로 시작(exit-code 0) - 베이스라인부터 확인하고 나중에 hard-fail 전환 검토.
      # CRITICAL/HIGH만 봄(LOW/MEDIUM까지 포함하면 베이스 이미지 OS 패키지 CVE로 노이즈가
      # 너무 많아서 실제로 조치 가능한 신호가 묻힘)
      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.sha.outputs.value }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 0
          # trivy-action은 스캐너 자체 버전을 자기 릴리스에 고정값으로 박아둠(지금은 우연히
          # 최신이지만 시간 지나면 낡음) - "latest"로 명시해서 실행 때마다 최신 스캐너 받게 함
          version: latest

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      # kubectl로 클러스터에 직접 명령하는 대신, GitOps 진입점인 k8s/backend/kustomization.yaml의
      # 이미지 태그를 이번 커밋 SHA로 bump해서 git에 커밋함 - ArgoCD(모듈 eks의 Application)가
      # 이 커밋을 감지해서 자동으로 동기화/배포함. k8s/**는 이 워크플로우 트리거 paths에 없어서
      # 이 커밋이 워크플로우를 재귀적으로 재트리거하지 않음
      # workflow_run 트리거일 땐 체크아웃을 커밋 SHA(head_sha)로 직접 해서(위 checkout 스텝)
      # detached HEAD 상태가 됨 - 그 상태에서 그냥 "git push"만 하면 "브랜치에 있지 않다"로
      # 막힘(실제로 겪음). 어느 트리거든 HEAD를 명시적으로 main에 push하면 detached 여부와
      # 무관하게 항상 동작함 - 이 워크플로우 자체가 main 브랜치 전용(위 push 트리거 참고)
      - name: Bump image tag for ArgoCD sync
        run: |
          sed -i -E "s|(newTag: ).*|\1\"${{ steps.sha.outputs.value }}\"|" k8s/backend/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/backend/kustomization.yaml
          git commit -m "deploy: backend@${{ steps.sha.outputs.value }}"
          git push origin HEAD:main
