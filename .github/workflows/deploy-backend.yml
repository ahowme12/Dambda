name: Deploy Backend to ECS
# CI 트리거 확인용 (재확인)

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-production
  cancel-in-progress: true

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: my-app-dev-backend
  ECS_CLUSTER: my-app-dev-cluster
  ECS_SERVICE: my-app-dev-service

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-skip-session-tagging: true

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # buildx가 있어야 레이어 캐시를 쓸 수 있음 - 기본 docker build는 매번 러너를 새로
      # 띄우는 ubuntu-latest 특성상 로컬 캐시가 남아있을 수 없어서, package.json이
      # 안 바뀌어도 npm ci 레이어까지 매번 새로 실행됨
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          # type=gha는 저장소 전체가 10GB 캐시 한도를 공유해서(Terraform provider 캐시,
          # Flutter pub 캐시 등과 경쟁) 용량 찰 때마다 이 레이어 캐시부터 밀려날 수 있음 -
          # 이미 로그인/push 중인 ECR 자체를 캐시 저장소로 써서 그 경쟁을 아예 피함
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:buildcache
          cache-to: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:buildcache,mode=max,image-manifest=true

      - name: Deploy latest image to ECS
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"
