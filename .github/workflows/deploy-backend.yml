name: Deploy Backend to EKS
# CI 트리거 확인용 (배포 워크플로우 동작 확인)

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-production
  cancel-in-progress: true

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: my-app-dev-backend
  EKS_CLUSTER: my-app-dev-eks-cluster
  EKS_NAMESPACE: app
  EKS_DEPLOYMENT: backend

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-skip-session-tagging: true

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # buildx가 있어야 레이어 캐시를 쓸 수 있음 - 기본 docker build는 매번 러너를 새로
      # 띄우는 ubuntu-latest 특성상 로컬 캐시가 남아있을 수 없어서, package.json이
      # 안 바뀌어도 npm ci 레이어까지 매번 새로 실행됨
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          # type=gha는 저장소 전체가 10GB 캐시 한도를 공유해서(Terraform provider 캐시,
          # Flutter pub 캐시 등과 경쟁) 용량 찰 때마다 이 레이어 캐시부터 밀려날 수 있음 -
          # 이미 로그인/push 중인 ECR 자체를 캐시 저장소로 써서 그 경쟁을 아예 피함
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:buildcache
          cache-to: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:buildcache,mode=max,image-manifest=true

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      # 태그가 :latest 고정이라 이미지 내용이 바뀌어도 Deployment spec 자체엔 변화가 없어서
      # (ECS의 force-new-deployment와 동일한 이유) rollout restart로 강제로 새 파드를 띄움
      - name: Deploy latest image to EKS
        run: |
          aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"
          kubectl rollout restart deployment/"$EKS_DEPLOYMENT" -n "$EKS_NAMESPACE"
          kubectl rollout status deployment/"$EKS_DEPLOYMENT" -n "$EKS_NAMESPACE" --timeout=300s
