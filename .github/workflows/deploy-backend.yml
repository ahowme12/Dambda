name: Deploy Backend to EKS
# CI 트리거 확인용 (배포 워크플로우 동작 확인)

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

  workflow_dispatch:

permissions:
  # ArgoCD(GitOps) 전환 이후 배포 트리거는 kubectl이 아니라 k8s/backend/의 이미지 태그를
  # git에 커밋하는 것 - 그 커밋을 push하려면 contents: write가 필요함
  contents: write
  id-token: write

concurrency:
  group: backend-production
  cancel-in-progress: true

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: my-app-dev-backend

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-skip-session-tagging: true

      # dambda/** 변경과 backend/** 변경이 같은 push에 같이 실려오면 이 워크플로우와
      # terraform.yml이 동시에 켜짐 - 근데 계정이 비어있는 상태(막 destroy했거나 첫
      # 부트스트랩)면 ECR 레포 자체가 아직 없어서 곧바로 실패로 뜸. 진짜 코드 문제가 아니라
      # "인프라가 아직 안 갖춰짐"이라 실패 대신 조용히 스킵하고, terraform apply가 끝난 뒤
      # 다시 push하거나 workflow_dispatch로 재실행하면 됨
      - name: Check ECR repository exists
        id: ecr-check
        run: |
          if aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ECR 레포($ECR_REPOSITORY)가 아직 없음 - 인프라가 아직 안 갖춰진 것으로 보고 이번 실행은 스킵합니다. terraform apply 완료 후 다시 push하거나 워크플로우를 수동 재실행하세요."
          fi

      - name: Login to Amazon ECR
        id: login-ecr
        if: steps.ecr-check.outputs.exists == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      # buildx가 있어야 레이어 캐시를 쓸 수 있음 - 기본 docker build는 매번 러너를 새로
      # 띄우는 ubuntu-latest 특성상 로컬 캐시가 남아있을 수 없어서, package.json이
      # 안 바뀌어도 npm ci 레이어까지 매번 새로 실행됨
      - name: Setup Docker Buildx
        if: steps.ecr-check.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        if: steps.ecr-check.outputs.exists == 'true'
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          # type=gha는 저장소 전체가 10GB 캐시 한도를 공유해서(Terraform provider 캐시,
          # Flutter pub 캐시 등과 경쟁) 용량 찰 때마다 이 레이어 캐시부터 밀려날 수 있음 -
          # 이미 로그인/push 중인 ECR 자체를 캐시 저장소로 써서 그 경쟁을 아예 피함
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:buildcache
          cache-to: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:buildcache,mode=max,image-manifest=true

      # kubectl로 클러스터에 직접 명령하는 대신, GitOps 진입점인 k8s/backend/kustomization.yaml의
      # 이미지 태그를 이번 커밋 SHA로 bump해서 git에 커밋함 - ArgoCD(모듈 eks의 Application)가
      # 이 커밋을 감지해서 자동으로 동기화/배포함. k8s/**는 이 워크플로우 트리거 paths에 없어서
      # 이 커밋이 워크플로우를 재귀적으로 재트리거하지 않음
      - name: Bump image tag for ArgoCD sync
        if: steps.ecr-check.outputs.exists == 'true'
        run: |
          sed -i -E "s|(newTag: ).*|\1\"${{ github.sha }}\"|" k8s/backend/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/backend/kustomization.yaml
          git commit -m "deploy: backend@${{ github.sha }}"
          git push
