name: Deploy Frontend to S3
# CI 트리거 확인용 (배포 워크플로우 동작 확인)

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/deploy-frontend.yml"

  # dambda/**만 바뀐 push(또는 workflow_dispatch)로 terraform.yml이 돌 때, API Gateway/S3 정적
  # 사이트 버킷 같은 이 워크플로우가 조회/배포 대상으로 삼는 리소스가 아직 없을 수 있어서 -
  # terraform.yml이 끝난 뒤 자동으로 뒤따라오게 함(deploy-backend.yml과 동일한 이유)
  workflow_run:
    workflows: ["Terraform CI/CD (dambda)"]
    types: [completed]

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: frontend-production
  cancel-in-progress: true

env:
  AWS_REGION: ap-northeast-2

jobs:
  # API Gateway 엔드포인트 조회를 딱 한 번만 하고 아래 두 빌드 job에 공유하기 위해
  # 별도 job으로 뺌 (안 그러면 web/android 빌드 job이 각자 또 조회해야 함)
  lookup-api:
    name: Look up API Gateway endpoint
    runs-on: ubuntu-latest
    # workflow_run은 대상 워크플로우 성공/실패 상관없이 항상 트리거됨 - terraform.yml이
    # 실패했으면 아직 없는 리소스를 조회하다 또 실패하므로 스킵(build-web/android/deploy도
    # 이 job에 needs로 걸려있어서 자동으로 같이 스킵됨)
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    outputs:
      base_url: ${{ steps.api.outputs.base_url }}
      cognito_domain: ${{ steps.cognito.outputs.domain }}
      cognito_client_id: ${{ steps.cognito.outputs.client_id }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-skip-session-tagging: true

      # API Gateway 엔드포인트는 재생성될 때마다 서브도메인이 랜덤으로 바뀌어서
      # 하드코딩하지 않고 매번 AWS에서 현재 값을 직접 조회함
      - name: Look up API Gateway endpoint
        id: api
        run: |
          ENDPOINT=$(aws apigatewayv2 get-apis \
            --query "Items[?Name=='my-app-dev-api-gateway'].ApiEndpoint" \
            --output text)
          echo "base_url=$ENDPOINT" >> "$GITHUB_OUTPUT"

      # google_oauth_client_id/secret이 아직 안 채워져 있으면(기본값) User Pool은 있어도
      # Google IdP가 없는 상태 - 그래도 도메인/클라이언트 ID 자체는 항상 존재해서 조회 자체는 안전함
      - name: Look up Cognito Hosted UI domain
        id: cognito
        run: |
          POOL_ID=$(aws cognito-idp list-user-pools --max-results 60 \
            --query "UserPools[?Name=='my-app-dev-user-pool'].Id" --output text)
          CLIENT_ID=$(aws cognito-idp list-user-pool-clients --user-pool-id "$POOL_ID" \
            --query "UserPoolClients[?ClientName=='my-app-dev-app-client'].ClientId" --output text)
          DOMAIN=$(aws cognito-idp describe-user-pool --user-pool-id "$POOL_ID" \
            --query "UserPool.Domain" --output text)
          echo "domain=https://${DOMAIN}.auth.${AWS_REGION}.amazoncognito.com" >> "$GITHUB_OUTPUT"
          echo "client_id=$CLIENT_ID" >> "$GITHUB_OUTPUT"

  # web/android 빌드는 서로 의존관계가 없어서 같은 job에서 순서대로 돌리면 그만큼
  # 직렬로 시간이 더 듦 - 별도 job으로 쪼개서 병렬로 돌리고, 각자 산출물만
  # artifact로 올려서 마지막 deploy job이 합쳐 쓰게 함
  build-web:
    name: Build Flutter web
    needs: lookup-api
    runs-on: ubuntu-latest
    steps:
      # workflow_run 트리거는 기본적으로 default 브랜치 최신 커밋을 체크아웃함 - terraform.yml을
      # 트리거한 바로 그 커밋을 가져오도록 head_sha를 명시(그 사이 새 커밋이 push됐을 가능성 대비)
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      # COGNITO_REDIRECT_URI는 modules/cognito의 callback_urls(main.tf: https://{route53_cloudfront}
      # /auth/callback)와 반드시 일치해야 함 - 안 맞으면 Cognito가 redirect_uri_mismatch로 거부함.
      # 소셜 로그인은 웹에서만 지원(social_auth_platform_stub.dart) - APK 빌드엔 안 넘김
      - name: Build web
        working-directory: app
        run: |
          flutter build web --release \
            --dart-define=API_BASE_URL=${{ needs.lookup-api.outputs.base_url }} \
            --dart-define=COGNITO_DOMAIN=${{ needs.lookup-api.outputs.cognito_domain }} \
            --dart-define=COGNITO_CLIENT_ID=${{ needs.lookup-api.outputs.cognito_client_id }} \
            --dart-define=COGNITO_REDIRECT_URI=https://${{ vars.ROUTE53_CLOUDFRONT }}/auth/callback

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: app/build/web
          retention-days: 1

  build-android:
    name: Build Android APK
    needs: lookup-api
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      # Android APK 빌드(Gradle)에만 필요 - web 빌드 job에는 없어도 됨
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      # 릴리즈 빌드가 디버그 서명 그대로라(android/app/build.gradle.kts 참고) 별도
      # 키스토어 없이 바로 빌드됨 - 사이드로드 테스트용이지 스토어 배포용 아님
      - name: Build Android APK
        working-directory: app
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ needs.lookup-api.outputs.base_url }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1

  deploy:
    name: Sync to S3
    needs: [build-web, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-skip-session-tagging: true

      # 버킷 이름에 계정 ID가 붙어있어서(전역 유일성 확보용) 하드코딩하지 않고 조회함 -
      # 이러면 이 워크플로우를 계정 ID를 몰라도 다른 계정/레포에 그대로 재사용할 수 있음
      - name: Look up static site S3 bucket name
        run: |
          BUCKET=$(aws s3api list-buckets \
            --query "Buckets[?contains(Name,'my-app-dev-static-site')].Name" \
            --output text)
          echo "S3_BUCKET=$BUCKET" >> "$GITHUB_ENV"

      - name: Download web build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: web/downloads

      - name: Rename APK for download link
        run: mv web/downloads/app-release.apk web/downloads/dambda.apk

      - name: Sync to S3
        run: |
          aws s3 sync web "s3://$S3_BUCKET" --delete

      # CloudFront가 예전 파일을 캐싱하고 있을 수 있어서, sync 후 무효화 안 하면
      # 새로 배포해도 브라우저에 옛날 버전이 계속 보일 수 있음
      - name: Invalidate CloudFront cache
        run: |
          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Origins.Items[0].DomainName=='$S3_BUCKET.s3.$AWS_REGION.amazonaws.com'].Id" \
            --output text)
          if [ -n "$DIST_ID" ] && [ "$DIST_ID" != "None" ]; then
            aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
          else
            echo "CloudFront distribution을 못 찾음 (아직 terraform apply 전일 수 있음) - 무효화 건너뜀"
          fi
